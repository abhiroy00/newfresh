services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /freshdirect/redis
        awslogs-stream: redis
        awslogs-create-group: "true"

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /freshdirect/api
        awslogs-stream: api
        awslogs-create-group: "true"

volumes:
  redis_data:
