name: Mobile App — Build & Publish

on:
  push:
    branches: [main]
    paths:
      - 'freshdirect/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'freshdirect/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, android, ios]
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]

env:
  NODE_VERSION: '20'

permissions:
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Type-check (runs on every push/PR) ────────────────────────────────────
  check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freshdirect

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freshdirect/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  # ── 2. Android build (EAS) — manual dispatch only ────────────────────────────
  build-android:
    name: Android Build (EAS)
    runs-on: ubuntu-latest
    needs: check
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.platform == 'android' ||
        github.event.inputs.platform == 'all'
      )
    defaults:
      run:
        working-directory: freshdirect

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freshdirect/package-lock.json

      - run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build Android APK/AAB
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait
        env:
          EXPO_PUBLIC_API_URL: https://api.gmartfresh.com

  # ── 3. iOS build (EAS) — manual dispatch only ────────────────────────────────
  build-ios:
    name: iOS Build (EAS)
    runs-on: ubuntu-latest
    needs: check
    if: |
      github.event_name == 'workflow_dispatch' && (
        github.event.inputs.platform == 'ios' ||
        github.event.inputs.platform == 'all'
      )
    defaults:
      run:
        working-directory: freshdirect

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freshdirect/package-lock.json

      - run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build iOS IPA
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait
        env:
          EXPO_PUBLIC_API_URL: https://api.gmartfresh.com

  # ── 4. OTA update — automatic on push, or manual dispatch ────────────────────
  ota-update:
    name: OTA Update
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: freshdirect

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freshdirect/package-lock.json

      - run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Publish OTA update (preview + production channels)
        run: |
          eas update \
            --channel preview \
            --message "Deploy ${{ github.sha }}" \
            --non-interactive
          eas update \
            --channel production \
            --message "Deploy ${{ github.sha }}" \
            --non-interactive
        env:
          EXPO_PUBLIC_API_URL: https://api.gmartfresh.com

      # Builds installed before app.json's version went 1.0.0 → 1.0.1 (91b8407)
      # have runtime 1.0.0 and never receive the updates above. Their native
      # deps are identical to today's (package.json unchanged since 776ca78), so
      # publish the same bundle for runtime 1.0.0 too. Drop this step once all
      # users are on a 1.0.1+ build, or if a native dependency is ever added.
      - name: Publish OTA update for legacy runtime 1.0.0 builds
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.runtimeVersion = '1.0.0';
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "
          eas update \
            --channel preview \
            --message "Deploy ${{ github.sha }} (runtime 1.0.0)" \
            --non-interactive
          eas update \
            --channel production \
            --message "Deploy ${{ github.sha }} (runtime 1.0.0)" \
            --non-interactive
        env:
          EXPO_PUBLIC_API_URL: https://api.gmartfresh.com
