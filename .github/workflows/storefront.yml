name: Storefront — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - '.github/workflows/storefront.yml'
  pull_request:
    branches: [main]
    paths:
      - 'storefront/**'
  workflow_dispatch:

jobs:
  check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npx tsc -b

  deploy:
    name: Deploy to EC2 (nginx)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: storefront
    env:
      VITE_API_BASE_URL: https://api.gmartfresh.com/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Ship build to EC2, ensure nginx site exists, reload
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null

          # Idempotent nginx vhost for shop.gmartfresh.com — safe to rewrite on
          # every deploy. The ALB terminates TLS and forwards plain HTTP here,
          # so this listens on 80 same as the admin panel's server block.
          cat <<'NGINX_CONF' | ssh -i /tmp/deploy_key ubuntu@$EC2_HOST "sudo tee /etc/nginx/sites-available/shop.gmartfresh.com.conf > /dev/null"
          server {
              listen 80;
              server_name shop.gmartfresh.com;
              root /var/www/shop;
              index index.html;

              gzip on;
              gzip_types text/css application/javascript application/json image/svg+xml;

              location /assets/ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX_CONF

          ssh -i /tmp/deploy_key ubuntu@$EC2_HOST "sudo mkdir -p /var/www/shop && sudo ln -sf /etc/nginx/sites-available/shop.gmartfresh.com.conf /etc/nginx/sites-enabled/shop.gmartfresh.com.conf"

          tar czf - -C dist . | ssh -i /tmp/deploy_key ubuntu@$EC2_HOST \
            "sudo rm -rf /var/www/shop/* && sudo tar xzf - -C /var/www/shop && sudo chown -R www-data:www-data /var/www/shop && sudo nginx -t && sudo systemctl reload nginx"

          rm /tmp/deploy_key
