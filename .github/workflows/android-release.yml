name: Android — Play Store Release

# Builds the production AAB on EAS and auto-submits it to Google Play
# (track and rollout come from eas.json → submit.production). The Google
# service-account key is stored on expo.dev, not in the repo.
#
# Trigger: push a tag like `android-release-2026-11-01`, or run manually.
# Tags are used because releases are rare and deliberate — a normal push to
# main only ships an OTA update (mobile.yml), never a store build.
on:
  push:
    tags:
      - 'android-release-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build AAB + submit to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: freshdirect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: freshdirect/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      # Waits for the build and the submission so this job's result shows
      # whether the release actually reached Play Console.
      - name: Build production AAB and submit to Google Play
        run: |
          eas build \
            --platform android \
            --profile production \
            --auto-submit \
            --non-interactive
        env:
          EXPO_PUBLIC_API_URL: https://api.gmartfresh.com
