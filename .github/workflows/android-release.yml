name: Android — Play Store Release

# Builds the production AAB on EAS and auto-submits it to Google Play
# (track and rollout come from eas.json → submit.production). The Google
# service-account key is stored on expo.dev, not in the repo.
#
# Trigger: push a tag like `android-release-2026-11-01`, or run manually.
# Tags are used because releases are rare and deliberate — a normal push to
# main only ships an OTA update (mobile.yml), never a store build.
on:
  push:
    tags:
      - 'android-release-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build AAB + submit to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: freshdirect
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: freshdirect/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      # The Google Play service-account key lives in the PLAY_SERVICE_ACCOUNT_JSON
      # repo secret (the same one playstore.yml uses). EAS reads it from the
      # path in eas.json → submit.production; the file is deleted afterwards.
      - name: Write Google Play service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error title=Missing Play key::Add the Google Play service account JSON as the PLAY_SERVICE_ACCOUNT_JSON repository secret."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > google-services-key.json
          python3 -c "import json; d=json.load(open('google-services-key.json')); print('Play key for', d.get('client_email','?'))"

      # Waits for the build and the submission so this job's result shows
      # whether the release actually reached Play Console.
      - name: Build production AAB and submit to Google Play
        # On failure, the tail of EAS's output is re-emitted as an error
        # annotation: annotations show on the run page without opening the
        # (login-only) raw log, so the reason is visible at a glance.
        run: |
          set +e
          eas build \
            --platform android \
            --profile production \
            --auto-submit \
            --non-interactive 2>&1 | tee eas.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -40 eas.log | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=EAS build/submit failed::$msg"
          fi
          exit "$status"
        env:
          EXPO_PUBLIC_API_URL: https://api.gmartfresh.com

      - name: Remove Play key
        if: always()
        run: rm -f google-services-key.json
