name: Admin Panel — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
  workflow_dispatch:

jobs:
  check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    name: Deploy to EC2 (nginx)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: admin
    env:
      # No domain/TLS yet — API is plain HTTP on the EC2 box's own IP.
      # Update this once a domain + HTTPS are set up for the backend.
      VITE_API_BASE_URL: http://13.206.18.79:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Ship build to EC2 and reload nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null

          tar czf - -C dist . | ssh -i /tmp/deploy_key ubuntu@$EC2_HOST \
            "sudo rm -rf /var/www/admin/* && sudo tar xzf - -C /var/www/admin && sudo chown -R www-data:www-data /var/www/admin && sudo nginx -t && sudo systemctl reload nginx"

          rm /tmp/deploy_key
