name: Android — Google Play Release

on:
  push:
    branches: [main]
    paths:
      - 'freshdirect/**'
      - '.github/workflows/playstore.yml'
  # PRs only check that the bundle builds (debug-signed, never uploaded).
  pull_request:
    branches: [main]
    paths:
      - 'freshdirect/**'
      - '.github/workflows/playstore.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

env:
  NODE_VERSION: '20'
  PACKAGE_NAME: com.gmartfresh.app
  # Must stay above the highest versionCode ever uploaded to Play for this app.
  VERSION_CODE_OFFSET: '1000'
  EXPO_PUBLIC_API_URL: https://api.gmartfresh.com

permissions:
  contents: read

# Never run two uploads at once — Play rejects concurrent edits.
concurrency:
  group: playstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build AAB & upload to Play
    runs-on: ubuntu-latest
    # A cold build (no Gradle cache) compiles Skia/Reanimated natively for 4 ABIs.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: freshdirect

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: freshdirect/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Compute versionCode
        run: echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET))" >> "$GITHUB_ENV"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_UPDATES_CHANNEL: production

      - name: Decode upload keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release bundle (versionCode ${{ env.ANDROID_VERSION_CODE }})
        working-directory: freshdirect/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.ANDROID_VERSION_CODE }}
          path: freshdirect/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Google Play (${{ inputs.track || 'internal' }})
        if: github.event_name != 'pull_request'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: freshdirect/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
